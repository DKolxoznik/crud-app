<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center">Регистрация</h1>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" class="form-control" th:field="*{username}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" th:field="*{password}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Подтверждение пароля</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>
                <button type="submit" class="btn btn-success w-100">Создать аккаунт</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
            </p>
            <p class="text-muted small mt-2 mb-0 text-center">
                Новые пользователи получают роль USER (без удаления записей)
            </p>
        </div>
    </div>
</div>
</body>
</html>
