<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Ошибка ' + ${status}">Ошибка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 text-center" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body p-5">
            <h1 class="display-4 text-danger" th:text="${status}">404</h1>
            <h2 class="h4 mb-3" th:text="${title}">Ошибка</h2>
            <p class="text-muted" th:text="${message}">Сообщение об ошибке</p>
            <a th:href="@{/items}" class="btn btn-primary mt-3">На главную</a>
            <a th:href="@{/login}" class="btn btn-outline-secondary mt-3 ms-2">Войти</a>
        </div>
    </div>
</div>
</body>
</html>
